[package]
name = "adya"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Black-box transactional isolation checker: finds G0, G1, G-single, G2 and friends in database histories. A native, JVM-free take on Jepsen's Elle."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zaydmulani09/adya"
readme = "README.md"
keywords = ["database", "isolation", "jepsen", "testing", "serializability"]
categories = ["development-tools::testing", "database"]

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }
postgres = { version = "0.19.10", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["sqlite", "postgres", "mysql"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:postgres"]
mysql = ["dep:mysql"]
